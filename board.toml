schema_version = 2

[board]
name = "cupid"
soc = "SM8450"
description = "Xiaomi 12 (cupid)"
# The device package is linked as kits/<kit>. build-sheng-source-storage.py
# (the sheng UFS runtime builder) hardcodes kits/sheng when it runs from the
# assembled tree, so the kit folder must carry that name; the board itself is
# still cupid. This only changes the package folder, not any output name.
kit = "sheng"
soc_source = "sm8450"
# iPhone-flavoured iOS 27 profile. The profile is shipped in this repository
# under profiles/os/ and installed into the UniXNU checkout by
# scripts/install-os-profile.sh; UniXNU main does not carry it yet.
os_profile = "ios-27.0.1-24A446"

[userdata]
# Measured on the phone (PixelOS, root, 2026-11-07):
# /dev/block/by-name/userdata -> /dev/block/sda38
# start 25362432 (512-byte sectors), size 466862040 -> 4096-byte LBA
# first 3170304, count 58357755, last 61528058.
first_lba = 3170304
last_lba = 61528058
lba_bytes = 4096


[components]
# Stage 0. ArmDTPlatform, ArmCpu and XnuPrelink also come from the arm64e arch
# profile; they are repeated here because arrays replace inherited arrays.
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "ShengUfs", "RamBlock"]

[kernel]
defconfig = "cupid_ios27_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
  "build-fileset-release-reference.py --tree . --lto",
  "component:ShengUfs",
  "component:RamBlock",
  "build-sheng-source-storage.py --policy-dir scripts/policies/ipados-27.0.1-24A446",
]
config_fragments = ["arch:configs/common.config", "soc:configs/sm8450.config", "os:configs/ios.config"]
patch_series = [
  "arch:patches/xnu/series",
  "soc:patches/xnu-12377/series",
  "os:patches/xnu/series",
  "device:patches/xnu/series",
  "device:patches/xnu-12377/series",
]

[device_tree]
source = "device:dts/cupid.dts"
include_dirs = ["soc:dts"]

[firmware]
# The firmware is the current Mu-Silicium checkout (UniXNU/uefi-sheng); this
# repository carries the cupid platform overlay under firmware/ (cupidPkg and
# the cupid.toml boot-image config) and the CI copies it into that checkout.
config = "cupid"
dsc = "Platforms/Xiaomi/cupidPkg/cupid.dsc"
fd = "Build/cupidPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
# Gic-Spurious masks interrupts with no registered handler (as sheng does).
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
# Binaries is deliberately absent: cupidPkg runs with CUPID_VENDOR_HW = 0 and
# needs no stock vendor module. Add it when Binary/cupid is imported.
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm"]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "cupid"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "cupid-ios27"

[bootimg]
dtb = "build/cupid/cupid.dtb"
# Stock ABL FDT already carries the cont_splash_region on most waipio devices;
# keep the node here until the live cupid DTB is dumped, then drop it if present.
dtb_node = [{ path = "/reserved-memory/splash_region", props = [{ name = "label", type = "s", value = "cont_splash_region" }, { name = "reg", type = "x", value = ["0x0", "0xb8000000", "0x0", "0x2b00000"] }] }]

[payload]
volume = "CUPIDESP"
size_mib = 176
loader = "firmware"
title = "iOS 27"
dram_size = "0x80000000"
# The stack-shift fix is in the kernel; keep the panic screen so an exec/launchd
# failure is visible. The timed reset probe is deliberately off: with it the
# panic screen does not fit the probe-cave padding, and we need the panic text.
panic_screen = true
kernel_args = ["-v", "serial=3", "debug=0x14e", "kt_fixed_zones=120", "-no_slto_panic", "use_contiguous_hint=0", "native-source-storage=1", "native-ufs-root=1", "amfi_get_out_of_my_way=1", "launchdsuffix=release"]

[payload.adt]
# SM8450 msm-id 457 (0x1C9), from the vendor DTS qcom,msm-id.
chip_id = "457"
# Measured /proc/iomem: the largest contiguous System RAM run is
# 0x840000000-0x97fffffff (5 GiB) with a reserved tail from 0x96ef68000.
# 0x12e000000 (4.6875 GiB) stays below that tail.
owned_memory_size = "0x80000000"
packed_data_ramdisk = true
persistent_data = true
unique_chip_id = "required"

[adt.defaults.u32]
# /sys/hypervisor/type = gunyah (api 1, variant 81); there is no Apple PMGR.
vmm-present = 1
sleep-disabled = 1

[adt.product.string]
# The framebuffer path is 8-bit until the panel driver lands; the panel is P3.
artwork-display-gamut = "sRGB"

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ios-27.0.1-24A446" = "cupid_ios27_defconfig"
