# Codemagic build definition for the cupid / iOS 27 XNU kernel.
#
# Why this file exists: GitHub's hosted arm64 macOS runners spend hours in the queue
# ("The job was not acquired by Runner of type hosted"). Codemagic's individual free
# plan includes 500 macOS M2 minutes per month (one concurrency) and starts a build in
# minutes, so the same work is available there without waiting for GitHub capacity.
#
# The step order is a faithful port of the arm64 leg of .github/workflows/macos.yml
# (same UniXNU pin, same firmware repository, same Data seed). Differences:
#   - manual only (no trigger): one run is ~30 of the 500 free minutes, so nothing
#     starts unless "Start new build" is pressed in the Codemagic UI;
#   - no GitHub token: prepare-xnu-source.py lists Apple's headers through the
#     GitHub API, whose anonymous quota is exhausted on shared runner addresses.
#     The listings are written here from a blobless sparse clone of the same tags,
#     so the kernel step never calls api.github.com;
#   - the Data seed is the committed cupid-data-seed.dbr (run #57's seed), so the
#     APFS Data volume UUID stays the one the phone's userdata image was flashed with.
# Outputs go to artifacts/, which Codemagic returns as one downloadable zip.

workflows:
  cupid-ios27-kernel:
    name: cupid / iOS 27 kernel build
    instance_type: mac_mini_m2
    # Free-tier individual builds may run up to 120 minutes each.
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
        # The sheng reference pin: the raw-FAT payload and the driver/patch shapes
        # this board's firmware overlay expects (same as macos.yml).
        UNIXNU_PIN: 82b847c4ac3f68a57024b3082ffa3a03442defd9
        # Platform seed of the /chosen unique-chip-id. Not a per-device secret here:
        # 0x457 is the placeholder seed the bring-up payloads of this board already
        # carry, so the boot image it produces matches those images.
        UNIXNU_UNIQUE_CHIP_ID: "0x457"
    cache:
      cache_paths:
        - $HOME/Library/Caches/Homebrew
    artifacts:
      - artifacts/**/*
    scripts:
      - name: Describe the workspace
        script: |
          set -euo pipefail
          echo "clone:        $CM_BUILD_DIR"
          echo "branch:       $CM_BRANCH"
          echo "commit:       $CM_COMMIT"
          sw_vers
          uname -m
          df -h "$CM_BUILD_DIR"
          # Cheap gate first: the repository has to carry the assets the later
          # steps cannot rebuild.
          for f in cupid-data-seed.dbr cupid-data-seed.dbr.json \
                   firmware/Platforms/Xiaomi/cupidPkg firmware/Resources/Configs/cupid.toml \
                   patches/xnuprelink/fileset-cupid-24A446-symbols.json \
                   patches/darwinboot/0001-darwinboot-log-window-failure.patch; do
              [ -e "$CM_BUILD_DIR/$f" ] || { echo "missing repository file: $f" >&2; exit 1; }
          done

      - name: Check out UniXNU and the firmware
        script: |
          set -euo pipefail
          cd "$HOME"
          rm -rf UniXNU uefi-sheng
          git clone -q --depth 1 https://github.com/UniXNU/UniXNU.git UniXNU
          git -C UniXNU fetch -q --depth 1 origin "$UNIXNU_PIN"
          git -C UniXNU checkout -q "$UNIXNU_PIN"
          git -C UniXNU submodule update --init --recursive --depth 1
          git clone -q --depth 1 https://github.com/UniXNU/uefi-sheng.git uefi-sheng
          git -C uefi-sheng submodule update --init --depth 1 \
            Common/Mu Common/Mu_OEM_Sample Mu_Basecore Silicium-ACPI \
            Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl
          echo "UniXNU:      $(git -C UniXNU rev-parse HEAD)"
          echo "uefi-sheng:  $(git -C uefi-sheng rev-parse HEAD)"

      - name: Install the cupid platform overlay
        script: |
          set -euo pipefail
          cd "$HOME"
          test -d "$CM_BUILD_DIR/firmware/Platforms/Xiaomi/cupidPkg"
          test -f "$CM_BUILD_DIR/firmware/Resources/Configs/cupid.toml"
          rm -rf uefi-sheng/Platforms/Xiaomi/cupidPkg
          cp -R "$CM_BUILD_DIR/firmware/Platforms/Xiaomi/cupidPkg" uefi-sheng/Platforms/Xiaomi/cupidPkg
          install -m 0644 "$CM_BUILD_DIR/firmware/Resources/Configs/cupid.toml" \
            uefi-sheng/Resources/Configs/cupid.toml
          ls uefi-sheng/Platforms/Xiaomi/cupidPkg
          cat uefi-sheng/Resources/Configs/cupid.toml

      - name: Apply device-side UniXNU fixes
        script: |
          set -euo pipefail
          cd "$HOME/UniXNU"
          shopt -s nullglob
          for patch in "$CM_BUILD_DIR"/patches/unixnu/*.patch; do
            echo "applying $(basename "$patch")"
            git apply "$patch"
          done

      - name: Select the Xcode toolchain
        script: |
          set -euo pipefail
          echo "installed Xcode:"
          ls -d /Applications/Xcode*.app | sed 's/^/  /'
          xc=/Applications/Xcode-26.6.app
          if [ ! -d "$xc" ]; then
            echo "Xcode 26.6 is not installed on this machine" >&2
            exit 1
          fi
          sudo xcode-select -s "$xc" 2>/dev/null || true
          # Each Codemagic script runs in a fresh shell, so persist the choice in
          # a small file that the later steps source.
          {
            echo "export DEVELOPER_DIR=$xc/Contents/Developer"
            echo "export UNIXNU_DEVICE=$CM_BUILD_DIR"
            echo "export UNIXNU_UEFI=$HOME/uefi-sheng"
          } > "$HOME/env.sh"
          . "$HOME/env.sh"
          xcodebuild -version

      - name: Install host tools and report the toolchain
        script: |
          set -euo pipefail
          . "$HOME/env.sh"
          # Homebrew LLVM stays keg-only: clang must remain Xcode's. UniXNU finds
          # lld-link, llvm-lib and llvm-rc through /opt/homebrew/opt/llvm/bin itself.
          brew install llvm lld mtools dtc blacktop/tap/ipsw
          echo 'export PATH="$(brew --prefix ipsw)/bin:$PATH"' >> "$HOME/env.sh"
          . "$HOME/env.sh"
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          for tool in git make clang cmake ninja unifdef ld.lld lld-link llvm-lib llvm-rc \
                      mformat mcopy dtc fdtoverlay ipsw xcodebuild; do
            printf '%-14s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done
          df -h "$HOME"

      - name: Install the iOS 27 profile
        script: |
          set -euo pipefail
          . "$HOME/env.sh"
          cd "$UNIXNU_DEVICE"
          chmod +x scripts/*.sh
          scripts/install-os-profile.sh "$HOME/UniXNU"

      - name: Resolve the configuration
        script: |
          set -euo pipefail
          . "$HOME/env.sh"
          mkdir -p "$UNIXNU_DEVICE/artifacts"
          cd "$HOME/UniXNU"
          ./unixnu defconfig cupid_ios27_defconfig -D "$UNIXNU_DEVICE"
          ./unixnu fetch -D "$UNIXNU_DEVICE"
          ./unixnu status --json -D "$UNIXNU_DEVICE" | tee "$UNIXNU_DEVICE/artifacts/status.json"
          python3 - "$UNIXNU_DEVICE/artifacts/status.json" <<'PY'
          import json, sys
          status = json.load(open(sys.argv[1]))
          text = json.dumps(status)
          for needle in ("ios-27.0.1-24A446", "arm64e", "sm8450", "cupid_ios27"):
              if needle not in text:
                  sys.exit("resolved status is missing " + needle)
          print("status resolves the iOS 27 arm64e profile, the sm8450 source and the cupid defconfig")
          PY

      - name: Seed the Apple header listings
        script: |
          set -euo pipefail
          # "unixnu build kernel" assembles the tree; derive its path from the
          # resolved configuration instead of hardcoding it. assemble() only
          # mkdir(exist_ok) on .cache, so the listings written here survive into the
          # kernel step, where prepare-xnu-source.py finds them and skips the API.
          tree=$(python3 -c 'import json,os;print(json.load(open(os.environ["CM_BUILD_DIR"]+"/artifacts/status.json"))["output"]+"/tree")')
          echo "build tree: $tree"
          mkdir -p "$tree/.cache/sources" "$HOME/xnu-headers"
          cd "$HOME/xnu-headers"
          for spec in "driverkit:xnu-10063.121.3:iokit/DriverKit" "trustcache:xnu-8796.101.5:EXTERNAL_HEADERS/TrustCache"; do
            name=${spec%%:*}; rest=${spec#*:}; tag=${rest%%:*}; path=${rest#*:}
            if [ ! -d "$name/.git" ]; then
              rm -rf "$name"
              git clone -q --depth 1 --branch "$tag" --filter=blob:none --sparse \
                https://github.com/apple-oss-distributions/xnu.git "$name"
              git -C "$name" sparse-checkout set "$path"
            fi
          done
          python3 - "$HOME/xnu-headers" "$tree/.cache/sources" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root, out = Path(sys.argv[1]), Path(sys.argv[2])
          dk = root / 'driverkit' / 'iokit' / 'DriverKit'
          tc = root / 'trustcache' / 'EXTERNAL_HEADERS' / 'TrustCache'
          # Counts are the Apple source inventory for these tags (17 headers next to
          # DriverKit, 4 in crypto/, 5 in TrustCache). A short listing would leave a
          # header unrestorable and burn a whole build, so fail now.
          plan = [
              ('xnu-driverkit-10063.121.3.json', dk, 17),
              ('xnu-driverkit-crypto-10063.121.3.json', dk / 'crypto', 4),
              ('xnu-trustcache-8796.101.5.json', tc, 5),
          ]
          for name, source, expected in plan:
              files = sorted(source.glob('*.h'))
              if len(files) < expected:
                  raise SystemExit(f'{name}: {len(files)} headers, expected {expected}')
              if any(f.stat().st_size == 0 for f in files):
                  raise SystemExit(f'{name}: an empty header')
              entries = []
              for p in files:
                  data = p.read_bytes()
                  entries.append({"type": "file", "name": p.name, "size": len(data),
                                  "sha": hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest(),
                                  "download_url": p.resolve().as_uri()})
              (out / name).write_text(json.dumps(entries))
              print(f'{name}: {len(entries)} headers seeded')
          PY

      - name: Prepare the Data seed
        script: |
          set -euo pipefail
          . "$HOME/env.sh"
          cd "$HOME/UniXNU"
          mkdir -p build
          # The committed seed is run #57's; rescanning it only rewrites the JSON.
          cp "$UNIXNU_DEVICE/cupid-data-seed.dbr" build/cupid-data.dbr
          python3 "$UNIXNU_DEVICE/scripts/build-cupid-data-seed.py" \
            --unixnu . --output build/cupid-data.dbr --gib 64 --build 24A446 \
            --skip-setup --if-missing

      - name: Bind the Data volume UUID
        script: |
          set -euo pipefail
          . "$HOME/env.sh"
          cd "$HOME/UniXNU"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          seed = json.loads(Path('build/cupid-data.dbr.json').read_text())
          config = Path(os.environ['UNIXNU_DEVICE']) / 'configs/cupid_ios27_defconfig'
          text = config.read_text()
          if 'CONFIG_XNU_OWNER_DATA_MOUNT=y' not in text:
              text += 'CONFIG_XNU_OWNER_DATA_MOUNT=y\n'
          value = f'CONFIG_XNU_OWNER_DATA_VOLUME_UUID="{seed["uuid"]}"'
          if re.search(r'^CONFIG_XNU_OWNER_DATA_VOLUME_UUID=', text, re.M):
              text = re.sub(r'^CONFIG_XNU_OWNER_DATA_VOLUME_UUID=.*$', value, text, flags=re.M)
          else:
              text += value + '\n'
          config.write_text(text)
          print('Data UUID', seed['uuid'], 'seed bytes', seed['bytes'])
          PY
          ./unixnu defconfig cupid_ios27_defconfig -D "$UNIXNU_DEVICE"

      - name: Install the XnuPrelink reviewed symbols
        script: |
          set -euo pipefail
          . "$HOME/env.sh"
          cd "$HOME/UniXNU"
          shopt -s nullglob
          fixtures=("$UNIXNU_DEVICE"/patches/xnuprelink/fileset-cupid-*.json)
          if [ ${#fixtures[@]} -eq 0 ]; then
            echo "no reviewed symbol fixture; the source/kernel shapes must pair every target"
            exit 0
          fi
          test -d kits/XnuPrelink/fixtures
          install -m 0644 "${fixtures[@]}" kits/XnuPrelink/fixtures/
          python3 -c 'import glob,json; [print("reviewed functions:", len(d["functions"]), "kernelcache:", d["inputs"]["kernelcache_sha256"]) for p in glob.glob("kits/XnuPrelink/fixtures/fileset-cupid-*.json") for d in [json.load(open(p))]]'

      - name: Build the cupid device tree
        script: |
          set -euo pipefail
          . "$HOME/env.sh"
          cd "$UNIXNU_DEVICE"
          scripts/build-cupid-dtb.sh

      - name: Build the kernel
        script: |
          set -uo pipefail
          . "$HOME/env.sh"
          cd "$HOME/UniXNU"
          # The UI log keeps only the last lines: the whole build output also goes to
          # an artifact, which is where an error in the middle used to be lost.
          LOG="$UNIXNU_DEVICE/artifacts/kernel-build.log"
          ./unixnu build kernel -D "$UNIXNU_DEVICE" --data-ramdisk build/cupid-data.dbr 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          echo "kernel build exit status: $status"
          exit "$status"

      - name: Kernel diagnostics
        script: |
          set -uo pipefail
          . "$HOME/env.sh"
          cd "$HOME/UniXNU"
          {
            LOG=$(find out/cupid -name prelink.log | head -1)
            if [ -n "$LOG" ]; then echo "== $LOG"; tail -5 "$LOG"; fi
            find out/cupid -path '*/kernel/kernel.json' -exec python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));s=d.get("stubbed",{});m=d.get("missing",{});print("allow_missing",d.get("allow_missing"),"mapping_complete",d.get("mapping_complete"));print("stubbed_targets",sum(len(v) for v in s.values()),"sites",sum(sum(v.values()) for v in s.values()));print("missing_targets",sum(len(v) for v in m.values()));[print("owner",k,"stubbed",len(s.get(k,{})),"missing",len(m.get(k,{}))) for k in sorted(set(s)|set(m))]' {} \;
            export PATH="/opt/homebrew/opt/llvm/bin:$PATH"
            K=$(find out/cupid -path '*/kernel/kernel.macho' | head -1)
            if [ -n "$K" ]; then
              echo "kernel: $K"
              echo "bytes: $(wc -c < "$K")"
              llvm-nm -n "$K" > "$UNIXNU_DEVICE/artifacts/kernel-symbols.txt" 2>/dev/null || true
              echo "== segments"
              llvm-objdump --macho --private-headers "$K" 2>/dev/null | sed -n '1,90p'
            else
              echo "no kernel.macho"
            fi
          } > "$UNIXNU_DEVICE/artifacts/kernel-diag.txt" 2>&1
          cat "$UNIXNU_DEVICE/artifacts/kernel-diag.txt"

      - name: Patch DarwinBoot window diagnostics
        script: |
          set -euo pipefail
          . "$HOME/env.sh"
          cd "$HOME/UniXNU"
          git -C drivers/DarwinBoot apply \
            "$UNIXNU_DEVICE/patches/darwinboot/0001-darwinboot-log-window-failure.patch"

      - name: Build the package
        script: |
          set -euo pipefail
          . "$HOME/env.sh"
          cd "$HOME/UniXNU"
          ./unixnu build package -D "$UNIXNU_DEVICE"

      - name: Build the firmware
        script: |
          set -euo pipefail
          . "$HOME/env.sh"
          cd "$HOME/UniXNU"
          ./unixnu build firmware -D "$UNIXNU_DEVICE" --uefi "$UNIXNU_UEFI"

      - name: Build the payload
        script: |
          set -euo pipefail
          . "$HOME/env.sh"
          cd "$HOME/UniXNU"
          ./unixnu ipsw fetch StaticTrustCache "Cryptex1,SystemTrustCache" -D "$UNIXNU_DEVICE"
          python3 - <<'PY'
          import struct
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from unixnu.ipsw import im4p_payload

          base = Path('out/ipsw/24A446')
          static = im4p_payload((base / '043-69909-664.dmg.aea.trustcache').read_bytes())
          system = im4p_payload((base / '043-68526-711.dmg.aea.trustcache').read_bytes())
          bundle = struct.pack('<3I', 2, 12, 12 + len(static)) + static + system
          out = Path('build/cupid-trust.bundle')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(bundle)
          print(f'cupid trust bundle: {len(bundle)} bytes')
          PY
          ./unixnu build payload -D "$UNIXNU_DEVICE" --uefi "$UNIXNU_UEFI" \
            --unique-chip-id "$UNIXNU_UNIQUE_CHIP_ID" \
            --trust-cache build/cupid-trust.bundle --data-ramdisk build/cupid-data.dbr

      - name: Build the boot image
        script: |
          set -euo pipefail
          . "$HOME/env.sh"
          cd "$HOME/UniXNU"
          ./unixnu bootimg -D "$UNIXNU_DEVICE" --uefi "$UNIXNU_UEFI" \
            --dtb "$UNIXNU_DEVICE/build/cupid/cupid.dtb"

      - name: Collect the outputs
        script: |
          set -uo pipefail
          . "$HOME/env.sh"
          A="$UNIXNU_DEVICE/artifacts"
          cd "$HOME/UniXNU"
          for pattern in '*/boot/boot.img' '*/payload/payload.img' '*/kernel/kernel.json' '*/kernel/kernel.macho'; do
            find out/cupid -path "*/$pattern" -type f | while read -r f; do
              [ -e "$A/$(basename "$f")" ] || cp "$f" "$A/"
            done
          done
          find out/cupid -type f -name '*.log' -exec cp {} "$A/" \; 2>/dev/null || true
          find out/cupid -type f -name '*.json' -path '*prelink*' -exec cp {} "$A/" \; 2>/dev/null || true
          cp "$UNIXNU_DEVICE/build/cupid/cupid.dtb" "$A/" 2>/dev/null || true
          cp build/cupid-data.dbr.json "$A/" 2>/dev/null || true
          ls -la "$A"

      - name: Remove Apple inputs
        script: |
          set -uo pipefail
          cd "$HOME/UniXNU" || exit 0
          rm -rf out/ipsw out/feeds "$UNIXNU_DEVICE/.cache/firmware" || true
          find out/cupid -path '*/tree/.cache/firmware' -maxdepth 6 -exec rm -rf {} + 2>/dev/null || true

      - name: Summarise
        script: |
          set -uo pipefail
          . "$HOME/env.sh"
          A="$UNIXNU_DEVICE/artifacts"
          {
            echo "== cupid / iOS 27.0.1 (24A446, arm64e)"
            echo "commit:      $CM_COMMIT"
            echo "unixnu pin:  $UNIXNU_PIN"
            echo "uefi-sheng:  $(git -C "$UNIXNU_UEFI" rev-parse HEAD)"
            echo "data uuid:   $(python3 -c 'import json; print(json.load(open("'$A'/cupid-data.dbr.json"))["uuid"])' 2>/dev/null || echo unknown)"
            echo
            if [ -f "$A/kernel.json" ]; then
              echo "RESULT: kernel.json produced -> the kernel + prelink ran on this build"
            else
              echo "RESULT: no kernel.json -> the kernel did not complete; see kernel-build.log"
            fi
            if [ -f "$A/boot.img" ]; then
              echo "RESULT: boot.img produced -> flashable image ready"
            else
              echo "RESULT: no boot.img -> a later step failed"
            fi
            echo
            echo "== sizes"
            wc -c "$A"/boot.img "$A"/payload.img 2>/dev/null
            echo "== sha256"
            shasum -a 256 "$A"/boot.img "$A"/payload.img 2>/dev/null
          } | tee "$A/summary.txt"
