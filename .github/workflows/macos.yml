name: macOS kernel build

# Builds the arm64e iOS 27 XNU for cupid on a GitHub macOS runner. This is the
# reproducible host check while the phone is not attached: it resolves the
# iOS 27 profile, fetches the pinned sources, decodes the iPhone17,2 kernelcache
# and prelinks the kernel. It publishes text logs only (no Apple images).

on:
  workflow_dispatch:
  # The arm64 image is often cancelled for capacity (not acquired in 15 min). A scheduled run keeps
  # retrying without anyone pushing; the guard step below cancels it when it is not needed.
  schedule:
    - cron: "*/20 * * * *"
  push:
    branches: [main]
    paths:
      - "board.toml"
      - "feeds.toml"
      - "configs/**"
      - "drivers/**"
      - "dts/**"
      - "package/**"
      - "profiles/**"
      - "patches/**"
      - "scripts/**"
      - "firmware/**"
      - ".github/workflows/macos.yml"

permissions:
  contents: read
  actions: write   # only used to cancel a scheduled run that is not needed

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  kernel:
    # Both images carry Xcode 26.6. The arm64 image is often cancelled for capacity; the Intel one is not.
    # A scheduled run only starts the arm64 leg.
    runs-on: ${{ matrix.image }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'schedule' && '{"image":["macos-26"]}' || '{"image":["macos-26","macos-26-intel"]}') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UNIXNU_DEVICE: ${{ github.workspace }}/device
      # The boot-progress builder reads the firmware font header.
      UNIXNU_UEFI: ${{ github.workspace }}/uefi-sheng
      # prepare-xnu-source.py lists Apple sources through the GitHub API.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Scheduled run guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Cancel this run when a boot image already exists or an arm64 kernel job is really building.
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/macos.yml/runs?per_page=12" --jq '.workflow_runs[].id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq '.artifacts[].name' | grep -q '^cupid-bootimg'; then
              echo "a boot image already exists (run $id): stopping this scheduled run"
              gh run cancel "$GITHUB_RUN_ID"; sleep 30; exit 1
            fi
            live=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[] | select((.labels | index("macos-26")) and .status == "in_progress" and .started_at)] | length')
            if [ "$live" != "0" ]; then
              echo "an arm64 kernel job is already building (run $id): stopping this scheduled run"
              gh run cancel "$GITHUB_RUN_ID"; sleep 30; exit 1
            fi
          done
          echo "no boot image yet and no arm64 build running: this run goes on"

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          # The sheng reference pin: the raw-FAT payload and the driver/patch
          # shapes this board's firmware overlay expects.
          ref: 82b847c4ac3f68a57024b3082ffa3a03442defd9
          submodules: recursive
          path: UniXNU
          persist-credentials: false

      - name: Record the UniXNU revision
        id: unixnu-rev
        run: echo "rev=$(git -C UniXNU rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check out the firmware repository
        uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          persist-credentials: false

      - name: Record the firmware revision
        id: uefi-rev
        run: echo "rev=$(git -C uefi-sheng rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check out the firmware submodules
        working-directory: uefi-sheng
        run: |
          git submodule update --init --depth 1 \
            Common/Mu Common/Mu_OEM_Sample Mu_Basecore Silicium-ACPI \
            Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl

      - name: Install the cupid platform overlay
        run: |
          test -d device/firmware/Platforms/Xiaomi/cupidPkg
          test -f device/firmware/Resources/Configs/cupid.toml
          rm -rf uefi-sheng/Platforms/Xiaomi/cupidPkg
          cp -R device/firmware/Platforms/Xiaomi/cupidPkg uefi-sheng/Platforms/Xiaomi/cupidPkg
          install -m 0644 device/firmware/Resources/Configs/cupid.toml \
            uefi-sheng/Resources/Configs/cupid.toml
          ls uefi-sheng/Platforms/Xiaomi/cupidPkg
          cat uefi-sheng/Resources/Configs/cupid.toml

      - name: Apply device-side UniXNU fixes
        working-directory: UniXNU
        run: |
          shopt -s nullglob
          for patch in ../device/patches/unixnu/*.patch; do
            echo "applying $(basename "$patch")"
            git apply "$patch"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          if [ "$(brew --prefix)" = /usr/local ]; then
            # Intel: Homebrew has no llvm bottle here and builds it from source (6 h, then the job
            # times out). Take ipsw from its release, skip llvm/lld, and keep Homebrew as shipped.
            brew install mtools dtc
            mkdir -p "$RUNNER_TEMP/ipsw" "$RUNNER_TEMP/ipsw-x"
            gh release download -R blacktop/ipsw -p 'ipsw_*_macOS_x86_64.tar.gz' -D "$RUNNER_TEMP/ipsw"
            tar -xzf "$RUNNER_TEMP/ipsw"/ipsw_*.tar.gz -C "$RUNNER_TEMP/ipsw-x"
            sudo find "$RUNNER_TEMP/ipsw-x" -type f -name ipsw -exec install -m 0755 {} /usr/local/bin/ipsw ';'
            ipsw version
            # UniXNU's build scripts name the llvm tools by the arm64 prefix (llvm-objcopy).
            sudo mkdir -p /opt/homebrew/opt
            sudo ln -s "$(brew --prefix llvm@20)" /opt/homebrew/opt/llvm
            /opt/homebrew/opt/llvm/bin/llvm-objcopy --version
            # The package step links EDK II's BaseTools with lld-link, llvm-lib and llvm-rc, and the payload step
            # uses ld.lld. UniXNU looks for them in /usr/local/opt/llvm and /usr/local/opt/lld on this prefix,
            # and on PATH; they all ship with llvm@20. clang stays Xcode's: its directory is not put on PATH.
            sudo ln -sfn "$(brew --prefix llvm@20)" /usr/local/opt/llvm
            sudo ln -sfn "$(brew --prefix llvm@20)" /usr/local/opt/lld
            for tool in lld-link ld.lld llvm-lib llvm-rc; do
              sudo ln -sfn "$(brew --prefix llvm@20)/bin/$tool" "/usr/local/bin/$tool"
            done
            lld-link --version
          else
            brew install llvm lld mtools dtc blacktop/tap/ipsw
          fi
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Report the toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          for tool in git make clang cmake ninja unifdef ld.lld mformat mcopy dtc fdtoverlay ipsw xcodebuild; do
            printf '%-10s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done
          df -h "$GITHUB_WORKSPACE"

      - name: Install the iOS 27 profile
        working-directory: device
        run: scripts/install-os-profile.sh ../UniXNU

      - name: Resolve the configuration
        id: status
        working-directory: UniXNU
        run: |
          ./unixnu defconfig cupid_ios27_defconfig -D ../device
          ./unixnu fetch -D ../device
          ./unixnu status --json -D ../device | tee "$RUNNER_TEMP/status.json"
          python3 - "$RUNNER_TEMP/status.json" <<'PY'
          import json, sys
          status = json.load(open(sys.argv[1]))
          text = json.dumps(status)
          for needle in ("ios-27.0.1-24A446", "arm64e", "sm8450", "cupid_ios27"):
              if needle not in text:
                  sys.exit(f"::error::resolved status is missing {needle}")
          print("status resolves the iOS 27 arm64e profile, the sm8450 source and the cupid defconfig")
          PY

      - name: Restore the Data seed
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: UniXNU/build/cupid-data.dbr
          key: cupid-data-seed-v1-24A446

      - name: Prepare the Data seed
        id: data
        working-directory: UniXNU
        run: |
          if [ ! -f build/cupid-data.dbr ]; then
            os_image=$(./unixnu ipsw fetch OS -D ../device | tail -1)
            python3 ../device/scripts/build-cupid-data-seed.py \
              --unixnu . --os-image "$os_image" \
              --output build/cupid-data.dbr --gib 64 --build 24A446 --skip-setup
          else
            python3 ../device/scripts/build-cupid-data-seed.py \
              --unixnu . --output build/cupid-data.dbr --gib 64 --build 24A446 \
              --skip-setup --if-missing
          fi

      - name: Bind the Data volume UUID
        id: data-bind
        working-directory: UniXNU
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          seed = json.loads(Path('build/cupid-data.dbr.json').read_text())
          config = Path('../device/configs/cupid_ios27_defconfig')
          text = config.read_text()
          if 'CONFIG_XNU_OWNER_DATA_MOUNT=y' not in text:
              text += 'CONFIG_XNU_OWNER_DATA_MOUNT=y\n'
          value = f'CONFIG_XNU_OWNER_DATA_VOLUME_UUID="{seed["uuid"]}"'
          if re.search(r'^CONFIG_XNU_OWNER_DATA_VOLUME_UUID=', text, re.M):
              text = re.sub(r'^CONFIG_XNU_OWNER_DATA_VOLUME_UUID=.*$', value, text, flags=re.M)
          else:
              text += value + '\n'
          config.write_text(text)
          print('Data UUID', seed['uuid'], 'seed bytes', seed['bytes'])
          PY
          printf 'uuid=%s\n' "$(python3 -c 'import json; print(json.load(open("build/cupid-data.dbr.json"))["uuid"])')" >> "$GITHUB_OUTPUT"
          ./unixnu defconfig cupid_ios27_defconfig -D ../device

      - name: Restore the XNU build cache
        id: xnu-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            UniXNU/out/cupid/ios-27.0.1-24A446/cupid_ios27/tree/build
            UniXNU/out/cupid/ios-27.0.1-24A446/cupid_ios27/tree/.cache/fakeroot
          key: cupid-xnu-v2-${{ hashFiles('device/board.toml','device/configs/**','device/package/**','device/drivers/**','device/profiles/**','device/scripts/**','device/feeds.toml') }}-${{ steps.data-bind.outputs.uuid }}-${{ steps.unixnu-rev.outputs.rev }}-${{ github.sha }}
          restore-keys: |
            cupid-xnu-v2-${{ hashFiles('device/board.toml','device/configs/**','device/package/**','device/drivers/**','device/profiles/**','device/scripts/**','device/feeds.toml') }}-${{ steps.data-bind.outputs.uuid }}-${{ steps.unixnu-rev.outputs.rev }}-

      - name: Install the XnuPrelink reviewed symbols
        working-directory: UniXNU
        run: |
          shopt -s nullglob
          fixtures=(../device/patches/xnuprelink/fileset-cupid-*.json)
          if [ ${#fixtures[@]} -eq 0 ]; then
            echo "no reviewed symbol fixture; the source/kernel shapes must pair every target"
            exit 0
          fi
          test -d kits/XnuPrelink/fixtures
          install -m 0644 "${fixtures[@]}" kits/XnuPrelink/fixtures/
          python3 -c 'import glob,json; [print("reviewed functions:", len(d["functions"]), "kernelcache:", d["inputs"]["kernelcache_sha256"]) for p in glob.glob("kits/XnuPrelink/fixtures/fileset-cupid-*.json") for d in [json.load(open(p))]]'

      - name: Build the cupid device tree
        id: dtb
        working-directory: device
        run: scripts/build-cupid-dtb.sh

      - name: Build the kernel
        id: kernel
        working-directory: UniXNU
        run: ./unixnu build kernel -D ../device --data-ramdisk build/cupid-data.dbr

      - name: Prelink mapping summary
        if: always()
        working-directory: UniXNU
        run: |
          LOG=$(find out/cupid -name prelink.log | head -1)
          if [ -n "$LOG" ]; then
            echo "== $LOG"
            tail -5 "$LOG"
          fi
          REPORT=$(find out/cupid -path '*/kernel/kernel.json' | head -1)
          if [ -n "$REPORT" ]; then
          python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));s=d.get("stubbed",{});m=d.get("missing",{});print("allow_missing",d.get("allow_missing"),"mapping_complete",d.get("mapping_complete"));print("stubbed_targets",sum(len(v) for v in s.values()),"sites",sum(sum(v.values()) for v in s.values()));print("missing_targets",sum(len(v) for v in m.values()));[print("owner",k,"stubbed",len(s.get(k,{})),"missing",len(m.get(k,{}))) for k in sorted(set(s)|set(m))]' "$REPORT"
          else
            echo "no kernel report"
          fi

      - name: Save the XNU build cache
        if: always() && steps.xnu-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            UniXNU/out/cupid/ios-27.0.1-24A446/cupid_ios27/tree/build
            UniXNU/out/cupid/ios-27.0.1-24A446/cupid_ios27/tree/.cache/fakeroot
          key: cupid-xnu-v2-${{ hashFiles('device/board.toml','device/configs/**','device/package/**','device/drivers/**','device/profiles/**','device/scripts/**','device/feeds.toml') }}-${{ steps.data-bind.outputs.uuid }}-${{ steps.unixnu-rev.outputs.rev }}-${{ github.sha }}

      - name: Upload the native symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cupid-native-symbols
          path: |
            UniXNU/out/cupid/*/*/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf
            UniXNU/out/cupid/*/*/tree/build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf
            UniXNU/out/cupid/*/*/kernel/*.json
            UniXNU/out/cupid/*/*/logs/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Kernel diagnostics
        if: always()
        working-directory: UniXNU
        run: |
          export PATH="/usr/local/opt/llvm/bin:/opt/homebrew/opt/llvm/bin:$PATH"
          K=$(find out/cupid -path '*/kernel/kernel.macho' | head -1)
          [ -n "$K" ] || { echo "no kernel.macho"; exit 0; }
          {
            echo "kernel: $K"
            echo "bytes: $(wc -c < "$K")"
            llvm-nm -n "$K" > "$RUNNER_TEMP/syms.txt" 2>/dev/null || true
            echo "== segments"
            llvm-objdump --macho --private-headers "$K" 2>/dev/null | sed -n '1,90p'
            echo "== prelink counts"
            find out/cupid -name 'kernel.json' -exec python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(sys.argv[1], "stubbed", sum(len(v) for v in d.get("stubbed", {}).values()), "missing", sum(len(v) for v in d.get("missing", {}).values()))' {} \;
          } > "$RUNNER_TEMP/kernel-diag.txt" 2>&1
          cat "$RUNNER_TEMP/kernel-diag.txt"

      - name: Upload kernel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cupid-kernel-diag
          path: ${{ runner.temp }}/kernel-diag.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Patch DarwinBoot window diagnostics
        working-directory: UniXNU
        run: |
          git -C drivers/DarwinBoot apply \
            "$GITHUB_WORKSPACE/device/patches/darwinboot/0001-darwinboot-log-window-failure.patch"

      - name: Restore the package build cache
        id: package-cache
        uses: actions/cache/restore@v4
        with:
          path: UniXNU/out/cupid/ios-27.0.1-24A446/cupid_ios27/package
          key: cupid-pkg-v1-${{ hashFiles('device/board.toml','device/configs/**','device/package/**','device/drivers/**','device/scripts/**','device/profiles/**') }}-${{ steps.unixnu-rev.outputs.rev }}-${{ github.sha }}
          restore-keys: |
            cupid-pkg-v1-${{ hashFiles('device/board.toml','device/configs/**','device/package/**','device/drivers/**','device/scripts/**','device/profiles/**') }}-${{ steps.unixnu-rev.outputs.rev }}-

      - name: Build the package
        id: package
        if: steps.package-cache.outputs.cache-matched-key == ''
        working-directory: UniXNU
        run: ./unixnu build package -D ../device

      - name: Save the package build cache
        if: success() && steps.package-cache.outputs.cache-matched-key == ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: UniXNU/out/cupid/ios-27.0.1-24A446/cupid_ios27/package
          key: cupid-pkg-v1-${{ hashFiles('device/board.toml','device/configs/**','device/package/**','device/drivers/**','device/scripts/**','device/profiles/**') }}-${{ steps.unixnu-rev.outputs.rev }}-${{ github.sha }}

      - name: Restore the firmware build cache
        id: firmware-cache
        uses: actions/cache/restore@v4
        with:
          path: uefi-sheng/Build
          key: cupid-fw-v1-${{ hashFiles('device/firmware/**','device/package/**','device/board.toml','device/scripts/**') }}-${{ steps.uefi-rev.outputs.rev }}-${{ github.sha }}
          restore-keys: |
            cupid-fw-v1-${{ hashFiles('device/firmware/**','device/package/**','device/board.toml','device/scripts/**') }}-${{ steps.uefi-rev.outputs.rev }}-

      - name: Build the firmware
        id: firmware
        if: steps.firmware-cache.outputs.cache-matched-key == ''
        working-directory: UniXNU
        run: ./unixnu build firmware -D ../device --uefi ../uefi-sheng

      - name: Save the firmware build cache
        if: success() && steps.firmware-cache.outputs.cache-matched-key == ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: uefi-sheng/Build
          key: cupid-fw-v1-${{ hashFiles('device/firmware/**','device/package/**','device/board.toml','device/scripts/**') }}-${{ steps.uefi-rev.outputs.rev }}-${{ github.sha }}

      - name: Extract the OS trust caches
        working-directory: UniXNU
        run: ./unixnu ipsw fetch StaticTrustCache "Cryptex1,SystemTrustCache" -D ../device

      - name: Bundle the OS trust caches
        working-directory: UniXNU
        run: |
          python3 - <<'PY'
          import struct
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from unixnu.ipsw import im4p_payload

          base = Path('out/ipsw/24A446')
          static = im4p_payload((base / '043-69909-664.dmg.aea.trustcache').read_bytes())
          system = im4p_payload((base / '043-68526-711.dmg.aea.trustcache').read_bytes())
          bundle = struct.pack('<3I', 2, 12, 12 + len(static)) + static + system
          out = Path('build/cupid-trust.bundle')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(bundle)
          print(f'cupid trust bundle: {len(bundle)} bytes')
          PY

      - name: Build the payload
        id: payload
        working-directory: UniXNU
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: ./unixnu build payload -D ../device --uefi ../uefi-sheng --unique-chip-id "$UNIXNU_UNIQUE_CHIP_ID" --trust-cache build/cupid-trust.bundle --data-ramdisk build/cupid-data.dbr

      - name: Build the boot image
        id: bootimg
        working-directory: UniXNU
        run: |
          ./unixnu bootimg -D ../device --uefi ../uefi-sheng \
            --dtb ../device/build/cupid/cupid.dtb

      - name: Upload the boot image
        if: always() && steps.bootimg.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cupid-bootimg-${{ matrix.image }}
          path: |
            UniXNU/out/cupid/*/*/boot/boot.img
            UniXNU/out/cupid/*/*/payload/payload.img
          if-no-files-found: error
          retention-days: 7

      - name: Save the Data seed
        if: always() && steps.data-cache.outputs.cache-hit != 'true' && steps.data.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: UniXNU/build/cupid-data.dbr
          key: cupid-data-seed-v1-24A446

      - name: Upload the Data seed
        if: always() && steps.data.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cupid-data-seed
          path: |
            UniXNU/build/cupid-data.dbr
            UniXNU/build/cupid-data.dbr.json
          if-no-files-found: error
          retention-days: 7

      - name: Collect text logs
        if: always() && steps.status.outcome == 'success'
        working-directory: UniXNU
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP/status.json" "$RUNNER_TEMP/logs/" 2>/dev/null || true
          find out/cupid -type f -name '*.log' -exec cp {} "$RUNNER_TEMP/logs/" \; 2>/dev/null || true
          find out/cupid -type f -name '*.json' -path '*prelink*' -exec cp {} "$RUNNER_TEMP/logs/" \; 2>/dev/null || true
          ls -la "$RUNNER_TEMP/logs"

      - name: Upload logs
        if: always() && steps.status.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cupid-ios27-kernel-logs
          path: ${{ runner.temp }}/logs/*
          if-no-files-found: warn
          retention-days: 7

      - name: Remove Apple inputs
        if: always()
        run: rm -rf out/ipsw out/feeds device/.cache/firmware out/cupid/*/*/tree/.cache/firmware

      - name: Summary
        if: always()
        env:
          KERNEL: ${{ steps.kernel.outcome }}
        run: |
          {
            echo "## cupid / iOS 27.0.1 (24A446, arm64e)"
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| resolve (defconfig, fetch, status) | ${{ steps.status.outcome }} |"
            echo "| kernel + prelink | ${KERNEL:-skipped} |"
            echo "| package (UniXNU.efi) | ${{ steps.package.outcome }} |"
            echo "| firmware (SILICIUM_UEFI.fd) | ${{ steps.firmware.outcome }} |"
            echo "| cupid.dtb | ${{ steps.dtb.outcome }} |"
            echo "| payload.img | ${{ steps.payload.outcome }} |"
            echo "| boot.img | ${{ steps.bootimg.outcome }} |"
            echo
            echo "iPhone17,2 (D94AP) profile, SM8450 SoC source, cupid defconfig. Text logs only."
          } >> "$GITHUB_STEP_SUMMARY"
