name: cupid dtb check

# Validates the two device trees cupid boots from, on a Linux runner.
# Neither step needs the macOS host: dtc / fdtoverlay / fdtput plus a C
# preprocessor all exist in the Ubuntu image. This exists so the trees can be
# verified without waiting for a contended macos-26 arm64 runner.
#
#   fdt   scripts/build-cupid-dtb.sh  -> build/cupid/cupid.dtb (the boot.img FDT)
#   adt   dts/cupid.dts + soc:dts     -> the tree XNU actually validates
#                                      (AppleARMCPU::_validateConfiguration())

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-cupid-dtb.sh"
      - "dts/**"
      - ".github/workflows/dtb-check.yml"

jobs:
  fdt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler clang

      - name: Build the cupid device tree
        run: scripts/build-cupid-dtb.sh

      - name: Upload the device tree and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cupid-dtb
          path: |
            build/cupid/cupid.dtb
            ${{ runner.temp }}/kernel-diag.txt
          if-no-files-found: warn

  adt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler clang

      - name: Fetch the soc include tree
        run: |
          mkdir -p build/adt
          cp dts/cupid.dts build/adt/cupid.dts
          curl -sSfL -o build/adt/sm8450.dtsi \
            https://raw.githubusercontent.com/obaosp/UniXNU-sm8450-common/main/dts/sm8450.dtsi
          wc -c build/adt/cupid.dts build/adt/sm8450.dtsi

      - name: Compile and dump the ADT source tree
        run: |
          cd build/adt
          dtc -I dts -O dtb cupid.dts -o cupid.dtb
          dtc -I dtb -O dts cupid.dtb > adt.dts
          sed -n '/cpus {/,/^\t};/p' adt.dts

      - name: Check the AppleARMCPU CPU contract
        run: python3 scripts/check-adt-cpus.py build/adt/adt.dts

      - name: Upload the compiled ADT tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cupid-adt
          path: |
            build/adt/cupid.dtb
            build/adt/adt.dts
          if-no-files-found: warn
